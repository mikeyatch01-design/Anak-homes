<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Anak Homes — Hosts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=9">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-beam" aria-hidden="true"></div>
  <a class="brand" href="index.html">
    <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-5.5h4V20h3.5a1 1 0 0 0 1-1v-9"/></svg></span>
    <span class="brand-text">Anak Homes</span>
  </a>
  <nav class="tnav" aria-label="Main">
    <a href="index.html">Dashboard</a>
    <a href="bookings.html">Bookings</a>
    <a href="host.html" class="active" aria-current="page">Hosts</a>
  </nav>
  <div class="topbar-right">
    <div class="profile">
      <button class="profile-btn" type="button" id="profileBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu">
        <span class="avatar" aria-hidden="true">A</span>
        <span class="profile-text"><span class="profile-role">Owner</span><span class="profile-name">Anak</span></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <div class="profile-menu" id="profileMenu" role="menu" hidden>
        <a href="settings.html" role="menuitem">Settings</a>
        <a href="#" role="menuitem" id="signOutLink">Sign out</a>
      </div>
    </div>
  </div>
</header>

<main class="page">
  <header class="page-head appear">
    <h1>Hosts</h1>
  </header>

  <div class="hosts-head appear" style="--d:.06s">
    <h2 class="section-pill">Hosts <span id="hostCount">0</span></h2>
    <button type="button" class="new-pill" id="addHostBtn"><span class="new-pill-plus" aria-hidden="true">+</span>Add host</button>
    <div class="filter-pills" id="hostFilters" role="group" aria-label="Show hosts">
      <button type="button" class="filter-pill active" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-pill" data-filter="busy" aria-pressed="false">Busy</button>
      <button type="button" class="filter-pill" data-filter="owed" aria-pressed="false">Owed payout</button>
      <button type="button" class="filter-pill" data-filter="quiet" aria-pressed="false">Quiet</button>
    </div>
  </div>

  <div class="host-grid appear" style="--d:.12s" id="hostGrid"></div>

</main>

<nav class="tabbar" aria-label="Main">
  <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Dashboard</span></a>
  <a href="bookings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14.5l2 2 4-4"/></svg><span>Bookings</span></a>
  <a href="host.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg><span>Hosts</span></a>
  <a href="settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Settings</span></a>
</nav>

<!-- Add host modal -->
<div class="modal-overlay" id="hostModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Add host</h2>
      <button type="button" class="modal-close" id="hostModalClose" aria-label="Close">&times;</button>
    </div>
    <form id="hostForm">
      <div class="form-row">
        <label>Host / property name
          <input type="text" id="fHostName" required placeholder="e.g. Kunduchi Beach">
        </label>
      </div>
      <div class="form-row">
        <label>Matching keyword(s)
          <input type="text" id="fHostKeywords" required placeholder="e.g. kunduchi, kunduchi beach">
        </label>
      </div>
      <p class="form-hint">
        When a booking's apartment field contains any of these words, it'll be
        counted under this host automatically — separate multiple with commas.
      </p>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="hostModalCancel">Cancel</button>
        <button type="submit" class="btn-primary">Save host</button>
      </div>
    </form>
  </div>
</div>

<!-- Host calendar modal -->
<div class="modal-overlay" id="hostCalendarOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="hostCalendarTitle">Host</h2>
      <button type="button" class="modal-close" id="hostCalendarClose" aria-label="Close">&times;</button>
    </div>
    <div class="hcal-nav">
      <button type="button" class="hcal-nav-btn" id="hostCalendarPrev" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <span class="hcal-month-label" id="hostCalendarMonthLabel">—</span>
      <button type="button" class="hcal-nav-btn" id="hostCalendarNext" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <div class="hcal-weekdays">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
    <div class="hcal-grid" id="hostCalendarGrid"></div>
    <div class="hcal-summary" id="hostCalendarSummary">—</div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script src="supabaseClient.js?v=2"></script>
<script src="data.js?v=4"></script>
<script src="auth.js?v=2"></script>
<script src="shell.js?v=1"></script>
<script src="host.js?v=4"></script>
</body>
</html>
