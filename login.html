<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anak Homes — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="scene">
  <div class="ambient" aria-hidden="true">
    <div class="glow-blob blob-a"></div>
    <div class="glow-blob blob-b"></div>
  </div>

  <div class="waves" aria-hidden="true">
    <svg class="wave wave-1" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0,100 C150,60 150,140 300,100 C450,60 450,140 600,100 C750,60 750,140 900,100 C1050,60 1050,140 1200,100" fill="none" stroke="#3B82F6" stroke-width="2"/>
    </svg>
    <svg class="wave wave-2" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0,110 C150,150 150,70 300,110 C450,150 450,70 600,110 C750,150 750,70 900,110 C1050,150 1050,70 1200,110" fill="none" stroke="#A78BFA" stroke-width="2"/>
    </svg>
    <svg class="wave wave-3" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0,90 C150,50 150,130 300,90 C450,50 450,130 600,90 C750,50 750,130 900,90 C1050,50 1050,130 1200,90" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="login-card" id="loginCard">
    <div class="login-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5"/>
        <path d="M5.5 10v9a1 1 0 0 0 1 1H10v-5.5h4V20h3.5a1 1 0 0 0 1-1v-9"/>
      </svg>
      <span>Anak Homes</span>
    </div>

    <h1>Welcome <span class="accent">back</span>.</h1>
    <p class="login-sub" id="loginSub">Enter your password to continue.</p>

    <form id="loginForm">
      <div class="field" id="passwordField">
        <label for="passwordInput">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="passwordInput" autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>

      <div class="field" id="recoveryField" hidden>
        <label for="recoveryInput">Recovery code</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          <input type="text" id="recoveryInput" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX">
        </div>
      </div>

      <div class="login-error" id="loginError"></div>

      <button type="submit" class="login-submit" id="loginSubmit">
        <span id="loginSubmitText">Sign in</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </form>

    <p class="login-hint" id="loginHint"></p>
    <button type="button" class="login-forgot" id="forgotBtn" hidden>Forgot your password?</button>
    <button type="button" class="login-forgot" id="backToPasswordBtn" hidden>← Back to password</button>
  </div>

</div>

<script src="data.js"></script>
<script src="login.js"></script>
</body>
</html>
